<text x="226" y="295" font-family="Urbanist, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#163144" text-anchor="start" letter-spacing="0" opacity="1">Anything missing along the way goes to the Inbox. Nobody waits: the work carries on with labelled assumptions.</text>
