<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="The 4EVR workflow: intake, research, brief, plan and hire, kickoff, execute, review, align, synthesise, retro">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3d3da"/><stop offset=".45" stop-color="#bfe0dc"/><stop offset="1" stop-color="#eaf7f2"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity=".26"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b405b"/><stop offset="1" stop-color="#163144"/></linearGradient>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#1b405b"/><rect width="2" height="6" fill="#163144"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#163144" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="330" rx="32" fill="url(#bg)"/><circle cx="1050" cy="40" r="170" fill="#9fe0c6" opacity=".8" filter="url(#blur)"/><circle cx="120" cy="320" r="170" fill="#7fb0c6" opacity=".7" filter="url(#blur)"/>
<rect x="40" y="34" width="196" height="84" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity=".8" filter="url(#shadow)"/>
